name: Build validation image
on:
  push:
    branches: [main]
    paths:
      - 'docker/validation/**'
      - 'scripts/validation-image.py'
      - '.github/workflows/build-validation-image.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trainer-validation-image
  cancel-in-progress: false
jobs:
  publish-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Login for this image-only publishing job
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, smoke-test and publish recipe image (no question code)
        run: python scripts/validation-image.py --publish
      - name: Remove registry session
        if: always()
        run: docker logout ghcr.io
