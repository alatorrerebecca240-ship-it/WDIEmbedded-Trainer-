name: Verify draft references in Docker
on:
  workflow_dispatch:
    inputs:
      pack:
        description: 'Repository-relative draft package path (commit an explicitly selected draft first)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRAFT_PATH: ${{ inputs.pack }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate selected path
        run: python scripts/check-draft-path.py
      - run: docker pull gcc:14
      - name: Static review plus isolated reference execution (does not approve or publish)
        run: python trainer.py packs audit "$DRAFT_PATH" --runner docker --report draft-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: draft-audit
          path: draft-audit.json
          if-no-files-found: warn
