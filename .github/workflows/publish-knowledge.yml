name: Publish reviewed knowledge packages
on:
  push:
    tags: ['knowledge-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing knowledge-v* tag on main; release must not already exist'
        type: string
        required: true
permissions: {}
concurrency:
  group: knowledge-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a reviewed main-branch tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^knowledge-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline tool tests
        run: python -m unittest discover -s tests -v
      - name: Prepare compiler container
        run: python scripts/validation-image.py
      - name: Recheck licenses, review fingerprint, duplicates, references and failing starters
        # The publisher has no write credential. Imported programs run with no network,
        # read-only source, no host home/socket mounts, memory/CPU/PID/time/output limits.
        run: python trainer.py packs publish-bundle --source knowledge/approved --output dist --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --runner docker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-knowledge
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Stage Pages catalog only (ZIP archives belong in Releases)
        run: python trainer.py packs stage-catalog dist/catalog.json --destination pages-catalog
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pages-catalog/
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: knowledge-release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download the verified artifact without running repository or question code
        run: gh run download "$GITHUB_RUN_ID" --name reviewed-knowledge --dir dist
      - name: Create immutable release (never clobber an existing release)
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^knowledge-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "Reviewed knowledge packages. Verify ZIP SHA-256 against catalog.json. Programs still require local trust before execution." dist/*.zip dist/*.sha256 dist/*.audit.json dist/catalog.json
  pages:
    needs: [verify, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish the catalog only after release assets exist
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
