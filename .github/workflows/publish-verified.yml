name: Publish using existing cloud evidence
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Reviewed existing tag; do not reexecute question programs'
        type: string
        required: true
        default: knowledge-v1.1.0
permissions: {}
concurrency:
  group: knowledge-publication
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: tools
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed main-branch tag
        working-directory: release-source
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^knowledge-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Package using authenticated prior evidence (no compiler or question execution)
        run: python tools/scripts/publish-verified.py --source release-source/knowledge/approved --output dist --tag "$RELEASE_TAG" --evidence tools/knowledge/release-evidence-v1.1.0.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-knowledge
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Stage catalog
        run: python tools/trainer.py packs stage-catalog dist/catalog.json --destination pages-catalog
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pages-catalog/
  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: knowledge-release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download packaged data without executing repository or question code
        run: gh run download "$GITHUB_RUN_ID" --name reviewed-knowledge --dir dist
      - name: Create immutable release
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^knowledge-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "50 reviewed Exercism questions. Reuses authenticated successful Docker reports bound to unchanged human-reviewed content; no repeated question execution. Foundation archive retained byte-for-byte. Verify ZIP SHA-256 against catalog.json. Local execution still requires explicit trust." dist/*.zip dist/*.sha256 dist/*.audit.json dist/catalog.json
  pages:
    needs: [package, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
