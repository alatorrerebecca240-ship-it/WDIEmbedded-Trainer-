name: Acquire and verify review inbox
run-name: trainer-review-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique request ID generated by the VS Code extension'
        type: string
        required: true
      plan:
        description: 'Pinned public upstream exercise IDs and expected hashes; no local source upload'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: trainer-review-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate plan and compute data-only cache key
        id: source-plan
        env:
          TRAINER_INBOX_PLAN: ${{ inputs.plan }}
        run: python scripts/verify-inbox.py --cache-key >> "$GITHUB_OUTPUT"
      - name: Restore pinned upstream blobs (not reports or executables)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .imports/ci-blobs
          key: trainer-blobs-v1-${{ runner.os }}-${{ hashFiles('trainerlib/exercism*.py') }}-${{ steps.source-plan.outputs.cache-key }}
          restore-keys: |
            trainer-blobs-v1-${{ runner.os }}-${{ hashFiles('trainerlib/exercism*.py') }}-
      - name: Prepare prebuilt compiler and Boost image
        run: python scripts/validation-image.py
      - name: Rebuild each question and verify only inside restricted Docker
        env:
          TRAINER_INBOX_PLAN: ${{ inputs.plan }}
        run: python scripts/verify-inbox.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trainer-review-${{ inputs.request_id }}
          path: inbox-results.json
          if-no-files-found: error
          retention-days: 30
      # Validation is per question. A green workflow does NOT mean all questions passed.
      # No approve, promotion, release, write token or automatic deployment.
